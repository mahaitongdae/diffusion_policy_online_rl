[project]
name = "diffusion-policy-online-rl"
version = "0.1.0"
description = "Diffusion Policy Online RL"
requires-python = ">=3.9"
dependencies = [
    # Fundamental
    "jax[cuda12]",
    "optax",
    "dm-haiku",
    "numpyro",
    "numba",
    "tensorboardX",
    "ipdb",
    
    # Used by environment
    "gymnasium[mujoco]==1.0.0",
    "dill==0.3.8",
    "matplotlib",
    "scikit-learn",
    "flatbuffers",
    "wandb",
    "pyyaml",
    
    # Utility
    "tqdm",
    "setproctitle",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
